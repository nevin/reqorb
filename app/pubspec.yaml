name: reqorb
description: "An API client for desktop and iPad, built on a Rust core."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  rust_lib_reqorb:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  path_provider: ^2.1.6
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
