[package]
name = "rust_lib_reqorb"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
reqorb-alloc = { version = "0.1.0", path = "../../crates/reqorb-alloc" }
reqorb-core = { version = "0.1.0", path = "../../crates/reqorb-core" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Pinned: libc 0.2.190 limits the dyld bindings to macOS, which breaks
# backtrace 0.3.76 (pulled in by flutter_rust_bridge) on iOS. Drop when fixed upstream.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
