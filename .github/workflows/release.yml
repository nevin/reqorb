name: Release

# Pushing a tag such as v0.2.0 builds the CLI for each platform and the macOS
# app, and publishes them as a GitHub release with their checksums and a
# Homebrew formula.
#
# The macOS app is signed with a Developer ID and notarized when these
# repository secrets are set, and signed ad hoc otherwise:
#   MACOS_CERTIFICATE           the Developer ID Application certificate, as
#                               base64 of a .p12 file
#   MACOS_CERTIFICATE_PASSWORD  the .p12 file's password
#   MACOS_SIGNING_IDENTITY      e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarization; the
#                               password is an app-specific one

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          app="$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml)"
          if [ "v$version" != "$GITHUB_REF_NAME" ] || [ "$version" != "$app" ]; then
            echo "::error::tag $GITHUB_REF_NAME, Cargo.toml $version, pubspec.yaml $app"
            exit 1
          fi

  cli:
    name: CLI (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: scripts/package-cli.sh ${{ matrix.target }} dist
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/*

  macos:
    name: macOS app
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
        working-directory: app
      - name: Put the signing certificate in a keychain of its own
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        if: env.CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          secret="$(openssl rand -hex 16)"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$secret" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$secret" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$secret" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Build, sign and pack
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/package-macos.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: dist/*

  publish:
    name: Publish the release
    needs: [cli, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write the Homebrew formula
        run: scripts/homebrew-formula.sh "${GITHUB_REF_NAME#v}" dist > dist/reqorb.rb
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
