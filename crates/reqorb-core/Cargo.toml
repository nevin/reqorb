[package]
name = "reqorb-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23.1"
cookie = "0.18.2"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
md-5 = "0.11.0"
ntlmclient = "0.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["brotli", "charset", "cookies", "deflate", "gzip", "http2", "multipart", "rustls", "system-proxy", "zstd"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
