[package]
name = "reqorb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
reqorb-core = { version = "0.1.0", path = "../reqorb-core" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

[[bin]]
name = "reqorb"
path = "src/main.rs"
