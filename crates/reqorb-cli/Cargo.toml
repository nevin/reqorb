[package]
name = "reqorb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
reqorb-core = { version = "0.1.0", path = "../reqorb-core" }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }

[[bin]]
name = "reqorb"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
