# Fuzzing for the parsers that read files from elsewhere. Needs nightly:
#   cargo +nightly fuzz run import
# Not part of the workspace, as it builds with sanitizers on nightly.
[package]
name = "reqorb-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
reqorb-core = { path = "../crates/reqorb-core" }

[[bin]]
name = "import"
path = "fuzz_targets/import.rs"
test = false
doc = false
bench = false

[[bin]]
name = "har"
path = "fuzz_targets/har.rs"
test = false
doc = false
bench = false

[[bin]]
name = "run_data"
path = "fuzz_targets/run_data.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graphql"
path = "fuzz_targets/graphql.rs"
test = false
doc = false
bench = false

[workspace]
